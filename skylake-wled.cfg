# Skylake Lighting System
# Keeps the top-cover 24 V rail enabled and mirrors the Snapmaker U1
# cavity-light state to WLED.
#
# IMPORTANT: Comment out "power_enable_pin: PE15" in the stock [purifier]
# section before loading this file. PE15 must never have two owners.
#
# Power behavior:
# - PE15 is enabled when Klipper configures the MCU.
# - PE15 remains enabled while Klipper is operating.
# - PE15 uses a safe inactive shutdown value.
#
# Master behavior:
# - Cavity light OFF always turns WLED OFF.
# - Cavity light ON turns WLED ON with preset 1.
# - Calls WLED only when the cavity-light state changes.

[output_pin skylake_24v]
pin: PE15
value: 1
shutdown_value: 0

[gcode_macro _SKYLAKE_WLED_STATE]
variable_last_cavity_state: -1
gcode:


[delayed_gcode _SKYLAKE_WLED_WATCHER]
initial_duration: 2
gcode:
    {% set colors = printer["led cavity_led"].color_data %}
    {% set cavity_on = 1 if colors and colors[0][3]|float > 0 else 0 %}
    {% set last_cavity_state =
        printer["gcode_macro _SKYLAKE_WLED_STATE"].last_cavity_state|int
    %}

    {% if cavity_on != last_cavity_state %}
        {% if cavity_on == 1 %}
            {action_call_remote_method(
                "set_wled_state",
                strip="skylake_lights",
                state=True,
                preset=1
            )}
        {% else %}
            {action_call_remote_method(
                "set_wled_state",
                strip="skylake_lights",
                state=False
            )}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_SKYLAKE_WLED_STATE VARIABLE=last_cavity_state VALUE={cavity_on}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_SKYLAKE_WLED_WATCHER DURATION=1
